name: Build Voltex IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned Voltex.ipa
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build the app (unsigned)
        run: |
          xcodebuild \
            -project Voltex.xcodeproj \
            -scheme Voltex \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package as .ipa
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/Voltex.app"
          test -d "$APP"
          rm -rf Payload Voltex.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Voltex.ipa Payload
          ls -lh Voltex.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Voltex-ipa
          path: Voltex.ipa
          if-no-files-found: error
